name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            django-version: "5.2.*"
          - python-version: "3.13"
            django-version: "6.1.*"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "Django==${{ matrix.django-version }}"

      - name: Run tests
        run: |
	  python -m django test csvimport.tests --settings=csvimport.settings
